name: Build ElysiaJS

# Reusable workflow: lint, test, audit and build an ElysiaJS (Bun) backend, then
# build a multi-arch image, smoke-test its health check, scan it with Trivy,
# push it, and sign it with cosign (keyless, GitHub OIDC).
#
# Caller needs:  permissions: { contents: read, packages: write, id-token: write, security-events: write }

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory, relative to the repository root.
        type: string
        default: .
      workspace-root:
        description: >-
          Bun workspace root (root package.json + bun.lock), relative to the repository root, for an app
          inside a Bun workspace. bun install, bun audit and the Docker build context use this directory;
          lint, test and build still run in working-directory, which must be inside it. Empty = working-directory
          is a standalone project.
        type: string
        default: ""
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      node-versions:
        description: JSON array of Node.js versions for the lint & test matrix.
        type: string
        default: '["22", "24"]'
      bun-version:
        description: Bun version used in CI and for the Docker base image tag.
        type: string
        default: "1"
      lint-command:
        description: Lint command. Empty skips linting.
        type: string
        default: bun run lint
      test-command:
        description: Test command. Empty skips tests.
        type: string
        default: bun run test
      build-command:
        description: Build command. Must produce the entry point in dist/.
        type: string
        default: bun run build
      entry-point:
        description: Built entry point, relative to working-directory.
        type: string
        default: dist/index.js
      audit-level:
        description: Fail on dependency advisories at or above this level (low, moderate, high, critical). Empty skips the audit.
        type: string
        default: high
      audit-ignore:
        description: >-
          Advisory ids (GHSA-xxxx-xxxx-xxxx or CVE-yyyy-n) bun audit should not fail on, separated by spaces,
          commas or newlines. Only for an advisory with no fixed version that cannot reach this app; record
          why next to the id in the caller. Empty ignores nothing.
        type: string
        default: ""
      runtime:
        description: Container runtime, "bun" or "node". "node" requires @elysiajs/node and a --target=node build.
        type: string
        default: bun
      node-version:
        description: Node.js major for the runtime-node image.
        type: string
        default: "24"
      port:
        description: Port the app listens on.
        type: number
        default: 3000
      health-path:
        description: HTTP path used by the image HEALTHCHECK and the smoke test.
        type: string
        default: /health
      smoke-test-env:
        description: Extra KEY=VALUE lines passed to the smoke-test container (e.g. dummy config the app needs to boot).
        type: string
        default: ""
      image-name:
        description: Full image name without tag. Default is <registry>/<owner>/<repo>, lowercased.
        type: string
        default: ""
      registry:
        description: Container registry host.
        type: string
        default: ghcr.io
      dockerfile:
        description: Dockerfile relative to working-directory. Empty uses docker/Dockerfile.elysia from this repository.
        type: string
        default: ""
      platforms:
        description: Target platforms for the pushed image.
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push the image. Never pushes on pull_request events.
        type: boolean
        default: true
      sign-image:
        description: Sign the pushed image with cosign (keyless).
        type: boolean
        default: true
      trivy-severity:
        description: Severities that fail the Trivy scan.
        type: string
        default: CRITICAL,HIGH
      upload-sarif:
        description: Upload Trivy results to GitHub code scanning.
        type: boolean
        default: true
      max-image-size-mb:
        description: Fail when the image is larger than this. 0 disables the check.
        type: number
        default: 0
      artifact-name:
        description: Name of the uploaded dist/ artifact. Must be unique per workflow run.
        type: string
        default: elysia-dist
      artifact-retention-days:
        type: number
        default: 5
    secrets:
      registry-username:
        description: Registry user. Default is github.actor.
        required: false
      registry-password:
        description: Registry password or token. Default is GITHUB_TOKEN (enough for ghcr.io).
        required: false
      build-env:
        description: dotenv (KEY=VALUE per line, values taken literally) exported during the build, in CI and in Docker (as a BuildKit secret).
        required: false
    outputs:
      image:
        description: Image name without tag.
        value: ${{ jobs.docker.outputs.image }}
      digest:
        description: Digest of the pushed multi-arch image. Empty when not pushed.
        value: ${{ jobs.docker.outputs.digest }}
      tags:
        description: Newline-separated tags applied to the image.
        value: ${{ jobs.docker.outputs.tags }}

permissions: {}

env:
  APP_DIR: ${{ inputs.working-directory == '.' && 'src' || format('src/{0}', inputs.working-directory) }}
  INSTALL_DIR: ${{ inputs.workspace-root != '' && (inputs.workspace-root == '.' && 'src' || format('src/{0}', inputs.workspace-root)) || (inputs.working-directory == '.' && 'src' || format('src/{0}', inputs.working-directory)) }}

jobs:
  quality:
    name: Lint & test (Node ${{ matrix.node-version }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory == '.' && 'src' || format('src/{0}', inputs.working-directory) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Checkout ptl-github-ci-templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ptl
          persist-credentials: false

      - name: Setup Bun
        uses: ./.ptl/.github/actions/setup-bun
        with:
          bun-version: ${{ inputs.bun-version }}
          node-version: ${{ matrix.node-version }}
          working-directory: ${{ env.INSTALL_DIR }}

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
        env:
          NODE_ENV: test

      - name: Build
        env:
          NODE_ENV: production
          BUILD_ENV: ${{ secrets.build-env }}
          ENTRY_POINT: ${{ inputs.entry-point }}
        run: |
          if [ -n "$BUILD_ENV" ]; then . "$GITHUB_WORKSPACE/.ptl/scripts/load-dotenv.sh"; ptl_load_dotenv /dev/stdin <<< "$BUILD_ENV"; fi
          ${{ inputs.build-command }}
          if [ ! -f "$ENTRY_POINT" ]; then
            echo "::error::Build did not produce $ENTRY_POINT (set the entry-point input)"
            exit 1
          fi

      - name: Audit dependencies
        if: strategy.job-index == 0 && inputs.audit-level != ''
        working-directory: ${{ env.INSTALL_DIR }}
        run: |
          args=(--audit-level="$AUDIT_LEVEL")
          for id in $(printf '%s' "$AUDIT_IGNORE" | tr ',' ' '); do
            if [[ ! "$id" =~ ^(GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}|CVE-[0-9]{4}-[0-9]+)$ ]]; then
              echo "::error::audit-ignore: '$id' is not a GHSA or CVE id"
              exit 1
            fi
            echo "::warning::bun audit ignores $id (audit-ignore)"
            args+=(--ignore="$id")
          done
          bun audit "${args[@]}"
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}

      - name: Upload dist
        if: strategy.job-index == 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.APP_DIR }}/dist
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error

  docker:
    name: Docker image
    needs: quality
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      image: ${{ steps.config.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Checkout ptl-github-ci-templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ptl
          persist-credentials: false

      - name: Resolve settings
        id: config
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          REGISTRY: ${{ inputs.registry }}
          WORKSPACE_ROOT: ${{ inputs.workspace-root }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          RUNTIME: ${{ inputs.runtime }}
          PUSH: ${{ inputs.push && github.event_name != 'pull_request' }}
        run: bash .ptl/scripts/resolve-docker-config.sh elysia "runtime-$RUNTIME"

      - name: Hash build-env
        id: build-env
        env:
          BUILD_ENV: ${{ secrets.build-env }}
        run: |
          if [ -n "$BUILD_ENV" ]; then
            echo "hash=$(printf '%s' "$BUILD_ENV" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.config.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for scanning
        id: build
        env:
          BUILD_ENV: ${{ secrets.build-env }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          target: ${{ steps.config.outputs.target }}
          platforms: ${{ steps.config.outputs.local-platform }}
          load: true
          tags: ${{ steps.config.outputs.scan-tag }}
          build-args: |
            BUN_VERSION=${{ inputs.bun-version }}
            NODE_VERSION=${{ inputs.node-version }}
            APP_ENTRY=${{ inputs.entry-point }}
            HEALTHCHECK_PATH=${{ inputs.health-path }}
            PORT=${{ inputs.port }}
            APP_DIR=${{ steps.config.outputs.app-path }}
            BUILD_COMMAND=${{ inputs.build-command }}
            BUILD_ENV_HASH=${{ steps.build-env.outputs.hash }}
          secret-envs: build-env=BUILD_ENV
          cache-from: type=gha,scope=${{ steps.config.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.cache-scope }}

      - name: Check image size
        env:
          IMAGE: ${{ steps.config.outputs.scan-tag }}
          MAX_MB: ${{ inputs.max-image-size-mb }}
        run: bash .ptl/scripts/check-image-size.sh

      - name: Smoke test health check
        env:
          IMAGE: ${{ steps.config.outputs.scan-tag }}
          SMOKE_TEST_ENV: ${{ inputs.smoke-test-env }}
        run: bash .ptl/scripts/smoke-test.sh

      - name: Trivy scan (SARIF)
        if: inputs.upload-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.config.outputs.scan-tag }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results
        if: inputs.upload-sarif && always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ steps.config.outputs.cache-scope }}

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.config.outputs.scan-tag }}
          format: table
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: ${{ inputs.upload-sarif }}

      - name: Log in to registry
        if: steps.config.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || github.token }}

      - name: Build and push multi-arch image
        id: push
        if: steps.config.outputs.push == 'true'
        env:
          BUILD_ENV: ${{ secrets.build-env }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          target: ${{ steps.config.outputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUN_VERSION=${{ inputs.bun-version }}
            NODE_VERSION=${{ inputs.node-version }}
            APP_ENTRY=${{ inputs.entry-point }}
            HEALTHCHECK_PATH=${{ inputs.health-path }}
            PORT=${{ inputs.port }}
            APP_DIR=${{ steps.config.outputs.app-path }}
            BUILD_COMMAND=${{ inputs.build-command }}
            BUILD_ENV_HASH=${{ steps.build-env.outputs.hash }}
          secret-envs: build-env=BUILD_ENV
          cache-from: type=gha,scope=${{ steps.config.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.cache-scope }}

      - name: Install cosign
        if: steps.config.outputs.push == 'true' && inputs.sign-image
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: steps.config.outputs.push == 'true' && inputs.sign-image
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .ptl/scripts/docker-summary.sh
