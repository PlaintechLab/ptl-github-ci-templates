name: Build Go

# Reusable workflow: format-check, vet, lint, test, security-scan and build a Go
# backend, then build a multi-arch image, smoke-test its health check, scan it
# with Trivy, push it, and sign it with cosign (keyless, GitHub OIDC).
#
# Caller needs:  permissions: { contents: read, packages: write, id-token: write, security-events: write }

on:
  workflow_call:
    inputs:
      working-directory:
        description: Module directory (contains go.mod), relative to the repository root.
        type: string
        default: .
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      go-versions:
        description: JSON array of Go versions for the test matrix. "go.mod" means the version in go.mod; "stable"/"oldstable" are the two supported releases.
        type: string
        default: '["go.mod", "stable"]'
      go-version:
        description: Go version for the Docker builder image. Empty uses major.minor from go.mod.
        type: string
        default: ""
      main-package:
        description: Package or file to build, relative to working-directory.
        type: string
        default: ./cmd/main.go
      binary-name:
        description: File name of the binary in the uploaded artifact.
        type: string
        default: app
      test-command:
        description: Test command. Empty skips tests.
        type: string
        default: go test -race -coverprofile=coverage.out ./...
      golangci-lint-version:
        description: golangci-lint version. Empty skips golangci-lint.
        type: string
        default: latest
      gosec-version:
        description: gosec version. Empty skips gosec.
        type: string
        default: v2.29.0
      gosec-args:
        description: Arguments passed to gosec.
        type: string
        default: -exclude-generated ./...
      govulncheck:
        description: Run govulncheck against the module.
        type: boolean
        default: true
      runtime:
        description: Container runtime, "alpine" or "distroless".
        type: string
        default: alpine
      port:
        description: Port the app listens on.
        type: number
        default: 8000
      health-path:
        description: HTTP path used by the image HEALTHCHECK and the smoke test.
        type: string
        default: /health
      smoke-test-env:
        description: Extra KEY=VALUE lines passed to the smoke-test container (e.g. dummy config the app needs to boot).
        type: string
        default: ""
      image-name:
        description: Full image name without tag. Default is <registry>/<owner>/<repo>, lowercased.
        type: string
        default: ""
      registry:
        description: Container registry host.
        type: string
        default: ghcr.io
      dockerfile:
        description: Dockerfile relative to working-directory. Empty uses docker/Dockerfile.go from this repository.
        type: string
        default: ""
      platforms:
        description: Target platforms for the pushed image.
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push the image. Never pushes on pull_request events.
        type: boolean
        default: true
      sign-image:
        description: Sign the pushed image with cosign (keyless).
        type: boolean
        default: true
      trivy-severity:
        description: Severities that fail the Trivy scan.
        type: string
        default: CRITICAL,HIGH
      upload-sarif:
        description: Upload Trivy results to GitHub code scanning.
        type: boolean
        default: true
      max-image-size-mb:
        description: Fail when the image is larger than this. 0 disables the check. Use 20 for distroless.
        type: number
        default: 50
      artifact-name:
        description: Name of the uploaded binary + SBOM artifact. Must be unique per workflow run.
        type: string
        default: go-binary
      artifact-retention-days:
        type: number
        default: 5
    secrets:
      registry-username:
        description: Registry user. Default is github.actor.
        required: false
      registry-password:
        description: Registry password or token. Default is GITHUB_TOKEN (enough for ghcr.io).
        required: false
    outputs:
      image:
        description: Image name without tag.
        value: ${{ jobs.docker.outputs.image }}
      digest:
        description: Digest of the pushed multi-arch image. Empty when not pushed.
        value: ${{ jobs.docker.outputs.digest }}
      tags:
        description: Newline-separated tags applied to the image.
        value: ${{ jobs.docker.outputs.tags }}

permissions: {}

env:
  APP_DIR: ${{ inputs.working-directory == '.' && 'src' || format('src/{0}', inputs.working-directory) }}

jobs:
  quality:
    name: Lint & test (Go ${{ matrix.go-version }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(inputs.go-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory == '.' && 'src' || format('src/{0}', inputs.working-directory) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version != 'go.mod' && matrix.go-version || '' }}
          go-version-file: ${{ matrix.go-version == 'go.mod' && format('{0}/go.mod', env.APP_DIR) || '' }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        if: strategy.job-index == 0 && inputs.golangci-lint-version != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ env.APP_DIR }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          MAIN_PACKAGE: ${{ inputs.main-package }}
          BINARY_NAME: ${{ inputs.binary-name }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=$GITHUB_SHA" -o "bin/$BINARY_NAME" "$MAIN_PACKAGE"
          size_mb=$(( ($(wc -c < "bin/$BINARY_NAME") + 1048575) / 1048576 ))
          echo "- **Binary (Go ${{ steps.setup-go.outputs.go-version }}):** ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt 30 ]; then
            echo "::warning::Binary is ${size_mb} MB, over the 30 MB target"
          fi

      - name: Generate SBOM
        if: strategy.job-index == 0
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.APP_DIR }}
          format: spdx-json
          output-file: ${{ env.APP_DIR }}/bin/sbom.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Upload binary and SBOM
        if: strategy.job-index == 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.APP_DIR }}/bin
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error

  security:
    name: Security scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory == '.' && 'src' || format('src/{0}', inputs.working-directory) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: gosec
        if: inputs.gosec-version != ''
        env:
          GOSEC_VERSION: ${{ inputs.gosec-version }}
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@$GOSEC_VERSION"
          gosec ${{ inputs.gosec-args }}

      - name: govulncheck
        if: inputs.govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker image
    needs: [quality, security]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      image: ${{ steps.config.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Checkout ptl-github-ci-templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ptl
          persist-credentials: false

      - name: Resolve settings
        id: config
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          REGISTRY: ${{ inputs.registry }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          RUNTIME: ${{ inputs.runtime }}
          PUSH: ${{ inputs.push && github.event_name != 'pull_request' }}
        run: bash .ptl/scripts/resolve-docker-config.sh go "runtime-$RUNTIME"

      - name: Resolve Go version
        id: go
        env:
          GO_VERSION: ${{ inputs.go-version }}
        run: |
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="$(awk '$1 == "go" { print $2 }' "$APP_DIR/go.mod" | cut -d. -f1,2)"
          fi
          echo "version=$GO_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.config.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for scanning
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ steps.config.outputs.dockerfile }}
          target: ${{ steps.config.outputs.target }}
          platforms: ${{ steps.config.outputs.local-platform }}
          load: true
          tags: ${{ steps.config.outputs.scan-tag }}
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            MAIN_PACKAGE=${{ inputs.main-package }}
            VERSION=${{ steps.meta.outputs.version }}
            HEALTHCHECK_PATH=${{ inputs.health-path }}
            PORT=${{ inputs.port }}
          cache-from: type=gha,scope=${{ steps.config.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.cache-scope }}

      - name: Check image size
        env:
          IMAGE: ${{ steps.config.outputs.scan-tag }}
          MAX_MB: ${{ inputs.max-image-size-mb }}
        run: bash .ptl/scripts/check-image-size.sh

      - name: Smoke test health check
        env:
          IMAGE: ${{ steps.config.outputs.scan-tag }}
          SMOKE_TEST_ENV: ${{ inputs.smoke-test-env }}
        run: bash .ptl/scripts/smoke-test.sh

      - name: Trivy scan (SARIF)
        if: inputs.upload-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.config.outputs.scan-tag }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results
        if: inputs.upload-sarif && always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ steps.config.outputs.cache-scope }}

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.config.outputs.scan-tag }}
          format: table
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: ${{ inputs.upload-sarif }}

      - name: Log in to registry
        if: steps.config.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || github.token }}

      - name: Build and push multi-arch image
        id: push
        if: steps.config.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ steps.config.outputs.dockerfile }}
          target: ${{ steps.config.outputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            MAIN_PACKAGE=${{ inputs.main-package }}
            VERSION=${{ steps.meta.outputs.version }}
            HEALTHCHECK_PATH=${{ inputs.health-path }}
            PORT=${{ inputs.port }}
          cache-from: type=gha,scope=${{ steps.config.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.cache-scope }}

      - name: Install cosign
        if: steps.config.outputs.push == 'true' && inputs.sign-image
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: steps.config.outputs.push == 'true' && inputs.sign-image
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .ptl/scripts/docker-summary.sh
