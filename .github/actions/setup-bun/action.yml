name: Setup Bun project
description: Install Bun (and optionally Node.js), restore the Bun install cache, and install dependencies from the lockfile.

inputs:
  bun-version:
    description: Bun version to install (e.g. "1.3.0", "1", "latest").
    required: false
    default: latest
  node-version:
    description: Node.js version to install alongside Bun. Leave empty to skip Node.js.
    required: false
    default: ""
  working-directory:
    description: Directory containing package.json and the Bun lockfile.
    required: false
    default: .
  enable-caching:
    description: Cache ~/.bun/install/cache keyed on the lockfile.
    required: false
    default: "true"
  production-only:
    description: Install only production dependencies (bun install --production).
    required: false
    default: "false"
  install:
    description: Run bun install. Set to "false" to only set up the toolchain.
    required: false
    default: "true"

outputs:
  installation-path:
    description: Absolute path of the bun executable.
    value: ${{ steps.verify.outputs.installation-path }}
  bun-version:
    description: Installed Bun version.
    value: ${{ steps.verify.outputs.bun-version }}
  cache-hit:
    description: "\"true\" when the cache was restored from an exact key match."
    value: ${{ steps.cache.outputs.cache-hit == 'true' }}
  duration:
    description: Seconds spent in this action.
    value: ${{ steps.verify.outputs.duration }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: start
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ENABLE_CACHING: ${{ inputs.enable-caching }}
        PRODUCTION_ONLY: ${{ inputs.production-only }}
        INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
        for pair in "enable-caching=$ENABLE_CACHING" "production-only=$PRODUCTION_ONLY" "install=$INSTALL"; do
          case "${pair#*=}" in
            true|false) ;;
            *) echo "::error::setup-bun: ${pair%%=*} must be \"true\" or \"false\", got \"${pair#*=}\""; exit 1 ;;
          esac
        done
        if [ ! -f "$WORKING_DIRECTORY/package.json" ]; then
          echo "::error::setup-bun: no package.json in \"$WORKING_DIRECTORY\""
          exit 1
        fi
        if [ "$INSTALL" = true ] && [ ! -f "$WORKING_DIRECTORY/bun.lock" ] && [ ! -f "$WORKING_DIRECTORY/bun.lockb" ]; then
          echo "::error::setup-bun: no bun.lock or bun.lockb in \"$WORKING_DIRECTORY\". Run \"bun install\" and commit the lockfile."
          exit 1
        fi

    - name: Install Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        no-cache: true

    - name: Restore Bun install cache
      id: cache
      if: inputs.enable-caching == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory), format('{0}/bun.lockb', inputs.working-directory)) }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PRODUCTION_ONLY: ${{ inputs.production-only }}
      run: |
        set -euo pipefail
        args=(--frozen-lockfile)
        [ "$PRODUCTION_ONLY" = true ] && args+=(--production)
        echo "bun install ${args[*]}"
        bun install "${args[@]}"

    - name: Verify toolchain
      id: verify
      shell: bash
      env:
        STARTED: ${{ steps.start.outputs.started }}
      run: |
        set -euo pipefail
        bun_path="$(command -v bun)"
        bun_version="$(bun --version)"
        duration=$(( $(date +%s) - STARTED ))
        echo "Bun $bun_version at $bun_path (node: $(command -v node >/dev/null && node --version || echo none)), ${duration}s"
        {
          echo "installation-path=$bun_path"
          echo "bun-version=$bun_version"
          echo "duration=$duration"
        } >> "$GITHUB_OUTPUT"
